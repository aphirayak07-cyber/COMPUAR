<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Computer Lab</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
      color: #1e293b;
    }

    .card {
      max-width: 650px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 16px;
    }

    model-viewer {
      width: 100%;
      height: 400px;
      background: #e2e8f0;
      border-radius: 12px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>3D Computer Lab</h1>
    <h2>หน่วยประมวลผลกลาง (CPU)</h2>

    <model-viewer
      id="model"
      src="./cpu_intel_4004.glb"
      alt="โมเดลหน่วยประมวลผลกลาง 3 มิติ"
      camera-controls
      auto-rotate
      ar
      ar-modes="scene-viewer webxr"
      ar-placement="floor"
      shadow-intensity="1">

    
    <p>
      	ทำหน้าที่ประมวลผลคำสั่ง คำนวณ และควบคุมการทำงานต่าง ๆ ของคอมพิวเตอร์      	เปรียบเสมือนสมองของคอมพิวเตอร์
    </p>

    <p>
      	ลากเพื่อหมุนโมเดล 
    </p>
  </div>
</body>
</html>
